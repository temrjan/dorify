name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dorify_user
          POSTGRES_PASSWORD: dorify_test_pass
          POSTGRES_DB: dorify_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dorify_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://dorify_user:dorify_test_pass@localhost:5432/dorify_v2_test
      REDIS_URL: redis://localhost:6379/5
      JWT_SECRET: test-secret-key-at-least-32-characters-long
      BOT_TOKEN: test-bot-token
      NODE_ENV: test

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dorify/api run prisma:generate

      - name: Lint API
        run: pnpm --filter @dorify/api run lint

      - name: Lint Web
        run: pnpm --filter @dorify/web run lint

      - name: Type check API
        run: pnpm --filter @dorify/api run type-check

      - name: Test
        run: pnpm --filter @dorify/api run test --passWithNoTests

      - name: Build API
        run: pnpm --filter @dorify/api run build

      - name: Type check Web
        run: pnpm --filter @dorify/web run type-check

      - name: Build Web
        run: pnpm --filter @dorify/web run build
